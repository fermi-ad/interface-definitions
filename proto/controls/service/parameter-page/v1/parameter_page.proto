syntax = "proto3";

package services.parameter_page.v1;

// Stores complete parameter page snapshots and assigns their IDs and revisions.
service ParameterPageService {
  // Returns summaries ordered by title and then ID.
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  // Returns NOT_FOUND when the ID is unknown.
  rpc GetPage(GetPageRequest) returns (Page);
  rpc CreatePage(CreatePageRequest) returns (Page);
  // Returns ABORTED when the revision is stale and NOT_FOUND for an unknown ID.
  rpc UpdatePage(UpdatePageRequest) returns (Page);
  // Returns ABORTED when the revision is stale and NOT_FOUND for an unknown ID.
  rpc DeletePage(DeletePageRequest) returns (DeletePageResponse);
}

message ListPagesRequest {}

message ListPagesResponse {
  repeated PageSummary pages = 1;
}

message PageSummary {
  string id = 1;
  string title = 2;
}

message GetPageRequest {
  string id = 1;
}

message CreatePageRequest {
  PageContent content = 1;
}

message UpdatePageRequest {
  string id = 1;
  string expected_revision = 2;
  PageContent content = 3;
}

message DeletePageRequest {
  string id = 1;
  string expected_revision = 2;
}

message DeletePageResponse {
  string id = 1;
}

message Page {
  string id = 1;
  // Opaque revision token. Use the latest value for updates and deletes.
  string revision = 2;
  PageContent content = 3;
}

message PageContent {
  string title = 1;
  repeated SubSystem sub_systems = 2;
}

message SubSystem {
  string title = 1;
  repeated Tab tabs = 2;
}

message Tab {
  string title = 1;
  repeated SubPage sub_pages = 2;
}

message SubPage {
  string title = 1;
  repeated Entry entries = 2;
}

message Entry {
  oneof kind {
    CommentEntry comment = 1;
    ParameterEntry parameter = 2;
    MultEntry mult = 3;
  }
}

message CommentEntry {
  string text = 1;
}

message ParameterEntry {
  string drf = 1;
  optional string label = 2;
  // Defaults to 1.0 when absent.
  optional double proportion = 3;
  // Defaults to true when absent.
  optional bool is_acnet = 4;
}

message MultEntry {
  // Number of following rows grouped within this subpage.
  int32 number_of_entries = 1;
  string description = 2;
}
