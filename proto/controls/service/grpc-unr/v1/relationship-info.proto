syntax = "proto3";

package services.relationship_info;

service RelationshipInfoService {
    rpc create(RelationshipRequest) returns (RelationshipResponse);
    rpc read(RelationshipRequest) returns (RelationshipResponse);
    rpc update(RelationshipRequest) returns (RelationshipResponse);
    rpc delete(RelationshipRequest) returns (RelationshipResponse);
}

message RelationshipRequest {
    string id = 1;
}

message RelationshipResponse {
    string parent_id = 1;
    repeated string child_ids = 2;
}
