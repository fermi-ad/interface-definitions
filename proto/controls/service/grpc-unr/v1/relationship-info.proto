syntax = "proto3";

import "google/protobuf/empty.proto";

package services.relationship_info;

service RelationshipInfoService {
    rpc create(RelationshipInfo) returns (google.protobuf.Empty);
    rpc read(RelationshipRequest) returns (RelationshipResponse);
    rpc update(RelationshipInfo) returns (google.protobuf.Empty);
    rpc delete(RelationshipRequest) returns (google.protobuf.Empty);
}

message RelationshipRequest {
    string id = 1;
}

message RelationshipInfo {
    string parent_id = 1;
    repeated string child_ids = 2;
}

message RelationshipResponse {
    repeated RelationshipInfo relationship_info = 1;
}
