syntax = "proto3";

package services.mi8_autotune.v1;

import "google/protobuf/empty.proto";

service AutotuneService {
  // Returns the BPM names that the autotuner is configured to read.
  rpc ListBpms(google.protobuf.Empty) returns (ListBpmsResponse);

  // Updates the Arm/Disarm state of the autotuner.
  rpc SetArmedState(SetArmedStateRequest) returns (google.protobuf.Empty);

  // Returns a stream of the latest Arm/Disarm state.
  // Immediately sends the current state, then sends updates whenever the reported
  // state or associated details change.
  rpc SubscribeArmedState(google.protobuf.Empty) returns (stream SubscribeArmedStateResponse);

  // Updates the operating mode of the autotuner.
  rpc SetOperatingMode(SetOperatingModeRequest) returns (google.protobuf.Empty);

  // Returns a stream of the latest operating mode.
  // Immediately sends the current state, then sends updates whenever the reported
  // state or associated details change.
  rpc SubscribeOperatingMode(google.protobuf.Empty) returns (stream SubscribeOperatingModeResponse);

  // Returns a stream of service states and associated message.
  // Immediately sends the current state, then sends updates whenever the reported
  // state or associated details change.
  rpc SubscribeEvents(google.protobuf.Empty) returns (stream SubscribeAutotuneEventResponse);
}

// Defines whether the service will make data acquisition.
enum ArmedState {
    ARMED_STATE_UNKNOWN = 0;
    ARMED_STATE_ARMED = 1;
    ARMED_STATE_DISARMED = 2;
}

// Defines whether the service will make setting requests.
// LIVE: Calculations will be made and settings will be requested
// SHADOW: Calculations will be made but settings will not requested.
// Note: If the armed state is DISARMED, calculations will not be made. 
enum OperatingMode {
    OPERATING_MODE_UNKNOWN = 0;
    OPERATING_MODE_LIVE = 1;
    OPERATING_MODE_SHADOW = 2;
}

enum AutotuneEvent {
    AUTOTUNE_EVENT_UNKNOWN = 0;
    // Automatic tuning is disabled.
    // This is dependent on the Armed state and operating mode
    AUTOTUNE_EVENT_NO_AUTO = 1;
    // This is the first pass after loading the control file.
    AUTOTUNE_EVENT_FIRST_PASS = 2;
    // A full tune move was proposed or recorded.
    AUTOTUNE_EVENT_MOVE = 3;
    // A tune attempt is pending a gate condition.
    AUTOTUNE_EVENT_MOVE_PENDING = 4;
    // DAQ data is missing or invalid.
    AUTOTUNE_EVENT_DAQ_ERROR = 5;
    // A BPM displacement exceeds the large-move threshold.
    AUTOTUNE_EVENT_BIG_MOVE = 6;
    // A vernier-only move was proposed or recorded.
    AUTOTUNE_EVENT_VERNIER_MOVE = 7;
    // No BPM is outside its applicable tolerance.
    AUTOTUNE_EVENT_BEAM_OK = 8;
    // A proposed absolute trim setting exceeds its configured limit.
    AUTOTUNE_EVENT_BIG_SETTING = 9;
    // Beam intensity is below its configured threshold.
    AUTOTUNE_EVENT_INTENSITY_LOW = 10;
    // An auxiliary reading is outside its configured range.
    AUTOTUNE_EVENT_AUXILIARY_BAD = 11;
    // A setting attempt failed.
    AUTOTUNE_EVENT_SETTING_ERROR = 12;
}

message SetArmedStateRequest {
    ArmedState armed_state = 1;
}

message SubscribeArmedStateResponse {
    ArmedState armed_state = 1;
}

message SetOperatingModeRequest {
    OperatingMode operating_mode = 1;
}

message SubscribeOperatingModeResponse {
    OperatingMode operating_mode = 1;
}

message ListBpmsResponse {
    repeated string bpms = 1;
}

message SubscribeAutotuneEventResponse {
    AutotuneEvent autotune_event = 1;
    string error_message = 2;
}
