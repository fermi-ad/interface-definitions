syntax = "proto3";

package services.mi8_autotune.v1;

import "google/protobuf/empty.proto";

service AutotuneService {
  // Returns the BPM names that the autotuner is configured to read.
  rpc ListBpms(google.protobuf.Empty) returns (ListBpmsResponse);

  // Updates the Arm/Disarm state of the autotuner.
  rpc SetArmDisarm(SetArmDisarmRequest) returns (google.protobuf.Empty);

  // Returns a stream of the latest Arm/Disarm state.
  rpc SubscribeArmDisarm(google.protobuf.Empty) returns (stream SubscribeArmDisarmResponse);

  // Returns a stream of alarms/errors generated by the autotuner
  rpc SubscribeAlarms(google.protobuf.Empty) returns (stream SubscribeAlarmsResponse);
}

enum ArmDisarm {
    ARM_DISARM_UNKNOWN = 0;
    ARM_DISARM_ARMED = 1;
    ARM_DISARM_DISARMED = 2;
}

message SetArmDisarmRequest {
    ArmDisarm arm_disarm = 1;
}

message SubscribeArmDisarmResponse {
    ArmDisarm arm_disarm = 1;
}

message ListBpmsResponse {
    repeated string bpms = 1;
}

message SubscribeAlarmsResponse {
    string error_message = 1;
}
