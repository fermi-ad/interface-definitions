syntax = "proto3";

package services.mi8_autotune.v1;

import "google/protobuf/empty.proto";

service AutotuneService {
  // Returns the device names that the autotuner is configured to read.
  rpc ListDevices(google.protobuf.Empty) returns (ListDevicesResponse);

  // Updates the Arm/Disarm state of the autotuner.
  rpc SetArmDisarm(ArmDisarm) returns (google.protobuf.Empty);

  // Returns a stream of the latest Arm/Disarm state.
  rpc SubscribeArmDisarm(google.protobuf.Empty) returns (stream ArmDisarm);

  // Returns a stream of alarms/errors generated by the autotuner
  rpc SubscribeAlarms(google.protobuf.Empty) returns (stream SubscribeAlarmsResponse);
}

enum ArmDisarm {
    ARM_DISARM_UNKNOWN = 0;
    ARM_DISARM_ARMED = 1;
    ARM_DISARM_DISARMED = 2;
}

message ListDevicesResponse {
    repeated string devices = 0;
}

message SubscribeAlarmsResponse {
    string error_message = 0;
}
